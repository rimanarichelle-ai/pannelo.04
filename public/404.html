<!doctype html>
<html lang="fr" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>404 — Page introuvable | PANNELLO</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" href="/assets/pannello_logo_cropped.png" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background-color: #f9fafb;
        background-image:
          linear-gradient(to right, rgba(0, 0, 0, 0.075) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0, 0, 0, 0.075) 1px, transparent 1px);
        background-size: 32px 32px;
        color: #111827;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 26rem;
        width: 100%;
        padding: 2.25rem 1.75rem;
        border-radius: 1rem;
        background: #ffffff;
        border: 1px solid rgba(0, 0, 0, 0.11);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
      }
      .logo {
        width: 180px;
        height: auto;
        margin: 0 auto 1.25rem;
        display: block;
      }
      .code {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #c8102e;
        margin-bottom: 0.5rem;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 800;
        margin-bottom: 0.5rem;
        color: #111827;
      }
      p {
        font-size: 0.875rem;
        line-height: 1.55;
        color: #4b5563;
        margin-bottom: 1.5rem;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0.65rem 1.35rem;
        border-radius: 0.625rem;
        background-color: #c8102e;
        color: #ffffff;
        font-size: 0.875rem;
        font-weight: 700;
        text-decoration: none;
        transition: background-color 150ms ease;
      }
      a.btn:hover {
        background-color: #a50d25;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/assets/pannello_logo_red.png" alt="PANNELLO — Taste The Best" class="logo" />
      <span class="code">Erreur 404</span>
      <h1>Page introuvable</h1>
      <p>Cette adresse n’existe pas. Accédez directement à la carte officielle du restaurant PANNELLO.</p>
      <a href="/" class="btn">Voir le menu PANNELLO</a>
    </main>
  </body>
</html>
